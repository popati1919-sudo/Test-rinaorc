plugins { id 'com.android.application' }
android {
    namespace 'net.rinaorc.control'
    compileSdk 35
    defaultConfig { applicationId 'net.rinaorc.control'; minSdk 23; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.debug' }; release { minifyEnabled false } }
}
