name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build all three applications
        run: gradle assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rinaorc-mobile-debug-apks
          path: |
            apps/launcher/build/outputs/apk/debug/*.apk
            apps/engine/build/outputs/apk/debug/*.apk
            apps/control/build/outputs/apk/debug/*.apk
          if-no-files-found: error
