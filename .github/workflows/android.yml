name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rinaorc-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Rinaorc Launcher, Engine and Control
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rinaorc-mobile-apps
          path: |
            apps/launcher/build/outputs/apk/debug/*.apk
            apps/engine/build/outputs/apk/debug/*.apk
            apps/control/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  amethyst-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "ndk;27.3.13750724"
      - name: Clone Amethyst source
        run: git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git .amethyst
      - name: Add Rinaorc 26.3 launch bridge
        run: bash scripts/patch-amethyst.sh "$GITHUB_WORKSPACE/.amethyst"
      - name: Build patched Amethyst
        working-directory: .amethyst
        run: ./gradlew --no-daemon :app_pojavlauncher:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rinaorc-amethyst-engine-26.3
          path: .amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
