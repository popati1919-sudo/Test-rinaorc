name: Rinaorc Mobile — single APK
on:
  push:
    branches: [ main, feature/rinaorc-one-apk ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --channel=3 "platforms;android-37.1" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Clone Amethyst source
        run: git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git .amethyst
      - name: Integrate Rinaorc into Amethyst
        run: bash scripts/patch-amethyst.sh "$GITHUB_WORKSPACE/.amethyst"
      - name: Configure Amethyst Java toolchains
        working-directory: .amethyst
        run: echo "org.gradle.java.installations.paths=$JAVA_HOME_8_X64,$JAVA_HOME_21_X64" >> gradle.properties
      - name: Build the single Rinaorc APK
        working-directory: .amethyst
        run: |
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug
          APK="$(find app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Rinaorc-Mobile.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Rinaorc-Mobile
          path: dist/Rinaorc-Mobile.apk
          if-no-files-found: error
