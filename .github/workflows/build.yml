name: Build APK depuis le ZIP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -q Rinaorc-Mobile.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le SDK Android (déjà présent sur la machine)
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Tests de core/common
        working-directory: Rinaorc-Mobile
        run: bash scripts/test-core.sh

      - name: Compiler l'APK
        working-directory: Rinaorc-Mobile
        run: gradle :apps:launcher:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rinaorc-Launcher
          path: Rinaorc-Mobile/apps/launcher/build/outputs/apk/debug/*.apk
